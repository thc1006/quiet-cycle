name: package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-09-17
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved 2026-09-17
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c constraints-contracts.txt -e ".[dev,api]"
      - run: python -m pytest --cov=quietcycle --cov-report=term
      - run: python scripts/generate_contracts.py --check
      - run: python -m mypy src/quietcycle
      - run: python -m ruff check src tests examples scripts
      - run: python -m build
      - run: python scripts/check_artifacts.py
