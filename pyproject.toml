[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "quiet-cycle"
version = "0.3.0"
description = "Typed menstrual-event data pipelines and deterministic research forecasts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Quiet Cycle contributors"}]
keywords = ["menstrual-cycle", "time-series", "deterministic", "health-data", "FHIR", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "jsonschema>=4.23,<5", "httpx>=0.27,<1", "mypy>=1.15,<2", "ruff>=0.12,<1", "build>=1.2,<2", "twine>=6,<7"]

[project.scripts]
quiet-cycle = "quietcycle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quietcycle = ["py.typed", "schemas/*.json"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["quietcycle"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/quietcycle"]
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
